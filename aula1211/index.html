
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="styleSheet" href="style.css">
    <title>Minha Loja Virtual</title>
</head>

<body>

    <header>
        <h1>Loja Virtual</h1>
        <p>Escolha seus produtos e faça suas compras!</p>
    </header>

    <!-- PRODUTOS -->

    <h2>Nossos Produtos</h2>
    <div class="produtos" id="produtos"></div>

    <!-- CARRINHO -->

    <div class="carrinho">
        <h2>Meu Carrinho</h2>

        <div id="listaCarrinho"></div>

        <div class="resumo">

            <p>Subtotal: <span id="subtotal">R$ 0,00</span></p>

            <p class="desconto">
                Desconto: <span id="desconto">R$ 0,00</span>
            </p>

            <p class="total">
                Total: <span id="total">R$ 0,00</span>
            </p>

            <button class="limpar" onclick="limparCarrinho()">
                Limpar Carrinho
            </button>

            <button onclick="finalizarCompra()">
                Finalizar Compra
            </button>

        </div>
    </div>

    <script>

        // CADASTRO DOS PRODUTOS

        const produtos = [
            {
                id: 1,
                nome: "Camiseta",
                preco: 49.90,
                emoji: "👕"
            },

            {
                id: 2,
                nome: "Sari",
                preco: 99.90,
                emoji: "🥻"
            },

            {
                id: 3,
                nome: "Tênis",
                preco: 159.99,
                emoji: "👟"
            },

            {
                id: 4,
                nome: "Mochila",
                preco: 79.90,
                emoji: "🎒"
            }
        ];


        // RECUPERAR DADOS DO LOCALSTORAGE

        let carrinho = [];

        try {

            carrinho = JSON.parse(
                localStorage.getItem("carrinho")
            ) || [];

            if (!Array.isArray(carrinho)) {
                carrinho = [];
            }

        } catch (erro) {

            carrinho = [];

        }


        // FORMATAR VALORES EM REAIS

        function moeda(valor) {

            return valor.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });

        }


        // MOSTRAR PRODUTOS NA TELA

        function mostrarProdutos() {

            let area = document.getElementById("produtos");

            area.innerHTML = "";

            produtos.forEach(function(produto) {

                area.innerHTML += `

                    <div class="produto">

                        <div class="emoji">${produto.emoji}</div>

                        <h3>${produto.nome}</h3>

                        <p class="preco">
                            ${moeda(produto.preco)}
                        </p>

                        <button onclick="adicionar(${produto.id})">
                            Adicionar ao carrinho
                        </button>

                    </div>

                `;

            });

        }


        // ADICIONAR PRODUTOS AO CARRINHO

        function adicionar(id) {

            let produto = produtos.find(function(p) {
                return p.id === id;
            });

            if (!produto) return;

            let item = carrinho.find(function(p) {
                return p.id === id;
            });

            if (item) {

                item.quantidade++;

            } else {

                carrinho.push({

                    id: produto.id,
                    nome: produto.nome,
                    preco: produto.preco,
                    quantidade: 1

                });

            }

            salvarCarrinho();
            mostrarCarrinho();

        }


        // SALVAR NO LOCALSTORAGE

        function salvarCarrinho() {

            localStorage.setItem(
                "carrinho",
                JSON.stringify(carrinho)
            );

        }


        // MOSTRAR O CARRINHO

        function mostrarCarrinho() {

            let lista = document.getElementById("listaCarrinho");

            lista.innerHTML = "";

            let subtotalGeral = 0;

            if (carrinho.length === 0) {

                lista.innerHTML = `
                    <p class="mensagem">
                        Seu carrinho está vazio!
                    </p>
                `;

            }

            carrinho.forEach(function(item) {

                let subtotal = item.preco * item.quantidade;

                subtotalGeral += subtotal;

                lista.innerHTML += `

                    <div class="item">

                        <div>

                            <strong>${item.nome}</strong>

                            <p>
                                ${moeda(item.preco)} cada
                            </p>

                            <p>
                                Subtotal: ${moeda(subtotal)}
                            </p>

                        </div>

                        <div class="quantidade">

                            <button onclick="alterarQuantidade(${item.id}, -1)">
                                -
                            </button>

                            <strong>${item.quantidade}</strong>

                            <button onclick="alterarQuantidade(${item.id}, 1)">
                                +
                            </button>

                        </div>

                        <button class="remover"
                            onclick="remover(${item.id})">

                            Remover

                        </button>

                    </div>

                `;

            });


            // CALCULAR DESCONTO

            let valorDesconto = 0;

            if (subtotalGeral >= 200) {

                valorDesconto = subtotalGeral * 0.10;

            }

            let totalFinal = subtotalGeral - valorDesconto;


            // ATUALIZAR VALORES NA TELA

            document.getElementById("subtotal").textContent =
                moeda(subtotalGeral);

            document.getElementById("desconto").textContent =
                moeda(valorDesconto);

            document.getElementById("total").textContent =
                moeda(totalFinal);

        }


        // AUMENTAR OU DIMINUIR QUANTIDADE

        function alterarQuantidade(id, valor) {

            let item = carrinho.find(function(p) {
                return p.id === id;
            });

            if (item) {

                item.quantidade += valor;

                if (item.quantidade <= 0) {

                    remover(id);
                    return;

                }

            }

            salvarCarrinho();
            mostrarCarrinho();

        }


        // REMOVER PRODUTO

        function remover(id) {

            carrinho = carrinho.filter(function(item) {
                return item.id !== id;
            });

            salvarCarrinho();
            mostrarCarrinho();

        }


        // LIMPAR O CARRINHO

        function limparCarrinho() {

            if (confirm("Deseja realmente limpar o carrinho?")) {

                carrinho = [];

                salvarCarrinho();
                mostrarCarrinho();

            }

        }


        // FINALIZAR COMPRA

        function finalizarCompra() {

            if (carrinho.length === 0) {

                alert("Adicione produtos antes de finalizar!");

                return;

            }

            let total = 0;

            carrinho.forEach(function(item) {

                total += item.preco * item.quantidade;

            });

            let desconto = 0;

            if (total >= 200) {

                desconto = total * 0.10;

            }

            total = total - desconto;

            alert(
                "COMPRA FINALIZADA!\n\n" +
                "Total da compra: " + moeda(total) +
                "\n\nObrigado pela preferência!"
            );

            carrinho = [];

            salvarCarrinho();
            mostrarCarrinho();

        }


        // INICIALIZAR O SISTEMA

        mostrarProdutos();
        mostrarCarrinho();

    </script>

</body>
</html>
